<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Гойдакрафт — Консоль сервера</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/styles.css">
<style>
html {
  scroll-behavior: smooth;
}
.page-head {
  background: linear-gradient(180deg, #2a1c0e 0%, #1a1108 100%);
  padding: 70px 32px 46px;
  text-align: center;
  border-bottom: 4px solid var(--wood-dark);
  position: relative;
  overflow: hidden;
}
.page-head h1 {
  font-family: var(--f-title);
  font-size: clamp(40px, 6vw, 72px);
  color: var(--brass-light);
  text-shadow: 0 2px 0 var(--brass-dark), 0 4px 0 #4a2810, 0 6px 14px rgba(0,0,0,0.5);
  margin: 0 0 10px;
}
.page-head p {
  font-family: var(--f-display);
  font-style: italic;
  font-size: 20px;
  color: var(--paper-2);
  margin: 0;
}
.deco-gear {
  position: absolute;
  opacity: 0.18;
  pointer-events: none;
}

.admin-wrap {
  max-width: 1220px;
  margin: 42px auto 0;
  padding: 0 32px;
}

.admin-grid {
  display: grid;
  grid-template-columns: 320px minmax(0, 1fr);
  gap: 22px;
}

.panel {
  background: var(--paper);
  border: 2px solid var(--copper-dark);
  box-shadow: 0 10px 24px rgba(0,0,0,0.2);
}

.side-panel {
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.side-title {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--copper-dark);
  margin: 0 0 8px;
}

.kpi {
  background: linear-gradient(180deg, #fff5dd, #f1dfba);
  border: 1.5px solid var(--paper-shadow);
  padding: 12px;
}
.kpi .label {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-faded);
}
.kpi .value {
  font-family: var(--f-title);
  font-size: 28px;
  color: var(--ink);
  line-height: 1.1;
  margin-top: 4px;
}

.btn {
  width: 100%;
  padding: 11px 12px;
  border: 2px solid #3a2810;
  background: linear-gradient(180deg, var(--brass-light), var(--brass) 42%, var(--brass-dark));
  color: #1a1108;
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 700;
  box-shadow: inset 0 -2px 4px rgba(0,0,0,0.26), inset 0 2px 3px rgba(255,230,160,0.45), 0 3px 8px rgba(0,0,0,0.2);
}
.btn:hover {
  transform: translateY(-1px);
}
.btn.alt {
  color: var(--paper);
  border-color: #4f6a80;
  background: linear-gradient(180deg, #35516a, #23384b);
}
.btn.warn {
  color: #fff4df;
  border-color: #6d2418;
  background: linear-gradient(180deg, #b34c33, #8e321f);
}

.console-panel {
  background: linear-gradient(180deg, #1a1108, #0a0703);
  border-color: var(--wood-dark);
  display: grid;
  grid-template-rows: auto 1fr auto;
  height: 640px;
  overflow: hidden;
}

.console-head {
  padding: 14px 16px;
  border-bottom: 1px solid rgba(200,155,60,0.35);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.console-head .left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.dot-live {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #6ad96e;
  box-shadow: 0 0 8px #6ad96e;
  animation: pulse-live 1.2s infinite;
}
@keyframes pulse-live {
  50% { opacity: 0.35; }
}
.console-head .title {
  font-family: var(--f-mono);
  font-size: 12px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--brass-light);
}
.head-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.head-actions button {
  padding: 7px 10px;
  border: 1px solid rgba(200,155,60,0.5);
  background: rgba(200,155,60,0.08);
  color: var(--paper-2);
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}
.head-actions button:hover {
  background: rgba(200,155,60,0.2);
}

.console-body {
  padding: 14px;
  overflow: auto;
  font-family: var(--f-mono);
  font-size: 13px;
  line-height: 1.45;
  color: #d6c9a7;
  background:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px),
    #090602;
  background-size: 100% 22px, 16px 100%, auto;
}

.line {
  white-space: pre-wrap;
  word-break: break-word;
}
.line .time {
  color: #b58e4a;
  margin-right: 8px;
}
.line.info { color: #d7c59f; }
.line.sys { color: #96c0d5; }
.line.ok { color: #83d182; }
.line.warn { color: #e8c878; }
.line.error { color: #e26868; }
.line.cmd { color: #ece2ca; }

.console-input-wrap {
  border-top: 1px solid rgba(200,155,60,0.35);
  padding: 12px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px;
  background: rgba(0,0,0,0.25);
}

#console-input {
  width: 100%;
  height: 42px;
  border: 2px solid #7a4818;
  background: #120c06;
  color: var(--paper);
  padding: 0 12px;
  font-family: var(--f-mono);
  font-size: 14px;
}
#console-input:focus {
  outline: none;
  border-color: var(--brass-light);
  box-shadow: 0 0 0 3px rgba(200,155,60,0.2);
}

.send-btn {
  padding: 0 16px;
  height: 42px;
  border: 2px solid #3a2810;
  background: linear-gradient(180deg, var(--copper-light), var(--copper), var(--copper-dark));
  color: #fff0d0;
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 700;
}

.footer {
  margin-top: 46px;
}

.access-denied {
  max-width: 760px;
  margin: 60px auto;
  padding: 34px;
  text-align: center;
}
.access-denied h2 {
  margin: 0 0 8px;
}
.access-denied p {
  margin: 0 0 20px;
  color: var(--ink-soft);
}

@media (max-width: 980px) {
  .admin-grid {
    grid-template-columns: 1fr;
  }
  .console-panel {
    height: 560px;
  }
}
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <a href="index.html" class="topnav-brand">
      <span style="display:inline-flex;width:28px;height:28px" class="gear-host" data-teeth="10" data-r="13" data-color="#c89b3c" data-highlight="#e8c878"></span>
      ГОЙДАКРАФТ
    </a>
    <div class="topnav-links">
      <a href="index.html" class="topnav-link">Главная</a>
      <a href="mods.html" class="topnav-link">Моды</a>
      <a href="connect.html" class="topnav-link">Подключение</a>
      <a href="donors.html" class="topnav-link">Доноры</a>
    </div>
  </div>
</nav>

<section class="page-head" id="console-head">
  <div class="deco-gear gear-host gear-spin" data-teeth="14" data-r="84" data-color="#8a6a1f" data-highlight="#c89b3c" style="left: 5%; top: 24%;"></div>
  <div class="deco-gear gear-host gear-spin ccw" data-teeth="10" data-r="48" data-color="#8a6a1f" data-highlight="#c89b3c" style="right: 9%; top: 28%;"></div>
  <h1>ADMIN CONSOLE</h1>
</section>

<main id="console-main" class="admin-wrap">
  <div class="admin-grid">
    <aside class="panel side-panel" aria-label="Панель администратора">
      <div>
        <p class="side-title">Состояние</p>
        <div class="kpi">
          <div class="label">Игроков онлайн</div>
          <div class="value" id="kpi-online">17</div>
        </div>
      </div>
      <div class="kpi">
        <div class="label">TPS</div>
        <div class="value" id="kpi-tps">19.9</div>
      </div>
      <div class="kpi">
        <div class="label">RAM</div>
        <div class="value" id="kpi-ram">13.1 GB</div>
      </div>
      <button class="btn" id="btn-refresh">Обновить метрики</button>
      <button class="btn alt" id="btn-restart">Перезапустить</button>
      <button class="btn warn" id="btn-clear-side">Очистить лог</button>
    </aside>

    <section class="panel console-panel" aria-label="Консоль сервера">
      <div class="console-head">
        <div class="left">
          <span class="dot-live" id="live-dot"></span>
          <span class="title" id="console-title">Серверная консоль</span>
        </div>
        <div class="head-actions">
          <button type="button" id="btn-export">Экспорт журнала</button>
        </div>
      </div>

      <div id="console-output" class="console-body" aria-live="polite"></div>

      <form id="console-form" class="console-input-wrap" autocomplete="off">
        <input id="console-input" name="command" type="text" placeholder="Введите команду... например: op PlayerName">
        <button class="send-btn" type="submit">Отправить</button>
      </form>
    </section>
  </div>
</main>

<footer class="footer">
  <div class="footer-orn"><span class="rivet"></span><span>ГОЙДАКРАФТ</span><span class="rivet"></span></div>
  © 2026 GOIDACRAFT. Пульт администратора.
</footer>

<script src="assets/decor.js"></script>
<script src="assets/tweaks.js"></script>
<script>
const ACCESS_KEY = 'goida_console_access';
const output = document.getElementById('console-output');
const input = document.getElementById('console-input');
const form = document.getElementById('console-form');

function renderAccessDenied() {
  const head = document.getElementById('console-head');
  if (head) head.style.display = 'none';
  const main = document.getElementById('console-main');
  main.innerHTML = `
    <section class="panel access-denied">
      <h2>Доступ ограничен</h2>
      <button class="btn" id="go-back-btn" type="button">Вернуться к модам</button>
    </section>
  `;
  document.getElementById('go-back-btn').addEventListener('click', () => {
    window.location.href = 'mods.html';
  });
}

const hasAccess = sessionStorage.getItem(ACCESS_KEY) === '1';
if (!hasAccess) {
  renderAccessDenied();
} else {
  sessionStorage.removeItem(ACCESS_KEY);
}

const params = new URLSearchParams(window.location.search);
const contextWord = (params.get('target') || 'guest').trim();
const logLines = [];
let streamTimer = null;
let streamIndex = 0;
const metricsState = {
  online: 17,
  tps: 19.9,
  ram: 13.1,
};

function nowStamp() {
  return new Date().toLocaleTimeString('ru-RU', { hour12: false });
}

function pushLine(text, type) {
  const lineType = type || 'info';
  const row = document.createElement('div');
  row.className = 'line ' + lineType;
  row.innerHTML = `<span class="time">[${nowStamp()}]</span>${text}`;
  output.appendChild(row);
  logLines.push(`[${nowStamp()}] ${text}`);
  output.scrollTop = output.scrollHeight;
}

function makeMockRows(seed) {
  const rows = [];
  const modules = ['AuthBridge', 'WorldChunker', 'RailNet', 'CreateBus', 'VoiceRelay', 'KubeRunner', 'EconomyPipe', 'BackupNode'];
  const levels = ['info', 'sys', 'warn', 'info', 'info', 'sys', 'info', 'warn'];
  for (let i = 1; i <= 100; i += 1) {
    const mod = modules[i % modules.length];
    const level = levels[i % levels.length];
    const base = String(i).padStart(3, '0');
    const textPool = [
      `boot/${base}: модуль ${mod} инициализирован`,
      `tick/${base}: heartbeat ok, ms=${15 + (i % 14)}`,
      `jobs/${base}: очередь задач = ${2 + (i % 7)}`,
      `sync/${base}: обновление профиля ${seed}_${(i % 9) + 1}`,
      `disk/${base}: snapshot segment ${Math.ceil(i / 5)} ready`,
      `net/${base}: handshake с node-${(i % 6) + 1} подтверждён`,
      `chat/${base}: фильтр проверил сообщение (${(i % 4) + 1}/4)`,
      `cache/${base}: ttl для чанка ${(i % 28) + 1}m`
    ];
    rows.push({ text: textPool[i % textPool.length], type: level });
  }
  return rows;
}

const mockRows = makeMockRows(contextWord);

function nextDelay() {
  return 500 + Math.floor(Math.random() * 3500);
}

function startStream() {
  if (!hasAccess || streamIndex >= mockRows.length || streamTimer) {
    return;
  }
  streamTimer = setTimeout(() => {
    streamTimer = null;
    if (streamIndex < mockRows.length) {
      const row = mockRows[streamIndex];
      pushLine(row.text, row.type);
      streamIndex += 1;
    }
    startStream();
  }, nextDelay());
}

function commandResponse(commandRaw) {
  const command = commandRaw.trim();
  if (!command) return;
  pushLine('> ' + command, 'cmd');
  const opMatch = command.match(/^op\s+([\wа-яА-ЯёЁ.-]+)$/i);
  if (opMatch) {
    const player = opMatch[1];
    pushLine(`Игрок ${player} назначен оператором`, 'ok');
    return;
  }
  pushLine('Неверная команда', 'error');
}

function exportLogs() {
  const content = logLines.join('\n') || 'Лог пуст';
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const dt = new Date();
  const pad = n => String(n).padStart(2, '0');
  const stamp = `${dt.getFullYear()}${pad(dt.getMonth() + 1)}${pad(dt.getDate())}_${pad(dt.getHours())}${pad(dt.getMinutes())}${pad(dt.getSeconds())}`;
  const fileName = `goidacraft-console-log-${stamp}.txt`;
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  pushLine(`Журнал экспортирован в ${fileName}`, 'sys');
}

function clearLog() {
  output.innerHTML = '';
  logLines.length = 0;
  pushLine('Лог очищен администратором', 'warn');
}

function randomizeMetrics() {
  const onlineDelta = Math.random() < 0.55 ? 0 : (Math.random() < 0.5 ? -1 : 1);
  metricsState.online = Math.min(24, Math.max(12, metricsState.online + onlineDelta));

  metricsState.tps = Math.min(20, Math.max(19.6, metricsState.tps + (Math.random() - 0.5) * 0.08));
  metricsState.ram = Math.min(13.8, Math.max(12.6, metricsState.ram + (Math.random() - 0.5) * 0.16));

  const tpsText = metricsState.tps.toFixed(2);
  const ramText = metricsState.ram.toFixed(1);
  document.getElementById('kpi-online').textContent = String(metricsState.online);
  document.getElementById('kpi-tps').textContent = tpsText;
  document.getElementById('kpi-ram').textContent = ramText + ' GB';
  pushLine(`Метрики обновлены: online=${metricsState.online}, tps=${tpsText}, ram=${ramText}GB`, 'sys');
}

function restartMockServer() {
  pushLine('Инициирован перезапуск сервера...', 'warn');
  setTimeout(() => pushLine('Сохранение мира... OK', 'info'), 220);
  setTimeout(() => pushLine('Остановка сервисов... OK', 'info'), 520);
  setTimeout(() => pushLine('Запуск ядра... OK', 'ok'), 860);
  setTimeout(() => pushLine('Сервер снова в онлайне', 'ok'), 1180);
}

if (hasAccess) {
  pushLine('admin-gateway: доступ подтверждён', 'ok');
  pushLine(`контекст сессии: ${contextWord}`, 'sys');
  startStream();

  form.addEventListener('submit', e => {
    e.preventDefault();
    commandResponse(input.value);
    input.value = '';
    input.focus();
  });

  document.getElementById('btn-export').addEventListener('click', exportLogs);
  document.getElementById('btn-clear-side').addEventListener('click', clearLog);
  document.getElementById('btn-refresh').addEventListener('click', randomizeMetrics);
  document.getElementById('btn-restart').addEventListener('click', restartMockServer);

  setInterval(randomizeMetrics, 7000);
}
</script>
</body>
</html>
